<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <title>full-free-proxy v0.0.2</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #0D9488;
            --primary-light: #5EEAD4;
            --primary-dark: #0F766E;
            --primary-bg-light: #CCFBF1;
            --primary-bg-hover: #F0FDFA;
            --bg: #F1F5F9;
            --card-bg: #FFFFFF;
            --text: #0F172A;
            --text-secondary: #475569;
            --border: #E2E8F0;
            --shadow: 0 4px 20px rgba(13, 148, 136, 0.10);
            --radius: 16px;
            --radius-sm: 10px;
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --http-color: #2563EB;
            --http-bg: #DBEAFE;
            --https-color: #059669;
            --https-bg: #D1FAE5;
            --socks4-color: #D97706;
            --socks4-bg: #FEF3C7;
            --socks5-color: #7C3AED;
            --socks5-bg: #EDE9FE;
            --success: #10B981;

            /* единые размеры кнопок */
            --btn-min-width: 110px;
            --btn-height: 36px;
            --btn-radius: 30px;
            --btn-font-size: 0.8rem;
            --btn-padding: 0 16px;
        }

        html {
            font-size: 16px;
        }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            margin: 0;
        }

        .app {
            max-width: 1100px;
            width: 100%;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 28px 30px 40px;
            will-change: transform;
            overflow: hidden;
        }

        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border);
            gap: 12px;
        }

        .header-left {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .header-left h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -0.3px;
        }

        .header-left h1 small {
            font-weight: 400;
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-left: 6px;
        }

        .header-left .subtitle {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .lang-switch {
            display: flex;
            gap: 4px;
            background: var(--bg);
            padding: 4px;
            border-radius: 30px;
            flex-shrink: 0;
        }
        .lang-switch button {
            border: none;
            background: transparent;
            padding: 4px 14px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            color: var(--text-secondary);
            transition: 0.2s;
            min-width: 44px;
            height: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .lang-switch button.active {
            background: white;
            color: var(--text);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
        }
        .lang-switch button:hover:not(.active) {
            color: var(--primary);
        }

        .total-badge {
            background: var(--bg);
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            white-space: nowrap;
            height: var(--btn-height);
            display: inline-flex;
            align-items: center;
        }
        .total-badge span {
            color: var(--primary);
            font-weight: 700;
        }

        /* ===== кнопка переключения фильтров ===== */
        .toggle-filters-btn {
            background: none;
            border: 1px solid var(--border);
            border-radius: var(--btn-radius);
            padding: var(--btn-padding);
            font-size: var(--btn-font-size);
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: 0.2s;
            background: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            white-space: nowrap;
            min-width: var(--btn-min-width);
            height: var(--btn-height);
            flex-shrink: 0;
        }
        .toggle-filters-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-bg-hover);
        }
        .toggle-filters-btn .icon {
            font-size: 1rem;
            line-height: 1;
        }

        .filters-wrapper {
            transition: all 0.3s ease;
            overflow: hidden;
        }
        .filters-wrapper-hidden {
            display: none !important;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px 18px;
            margin-bottom: 20px;
            background: var(--bg);
            padding: 14px 18px;
            border-radius: var(--radius-sm);
        }

        /* ===== группа фильтров протоколов ===== */
        .filter-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 8px;
            flex: 0 1 auto;
        }

        .filter-group .label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: var(--text-secondary);
            margin-right: 4px;
            flex-shrink: 0;
        }

        /* ===== кнопки-переключатели протоколов ===== */
        .proto-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            user-select: none;
            padding: 0 14px;
            border-radius: var(--btn-radius);
            background: white;
            border: 1px solid var(--border);
            transition: 0.2s;
            font-size: var(--btn-font-size);
            font-weight: 500;
            color: var(--text-secondary);
            flex-shrink: 0;
            min-width: 82px;
            height: var(--btn-height);
            white-space: nowrap;
        }
        .proto-toggle:hover {
            border-color: var(--primary-light);
        }
        .proto-toggle input[type="radio"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
            cursor: pointer;
            flex-shrink: 0;
            margin: 0;
        }
        .proto-toggle .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }
        .proto-toggle.active {
            border-color: var(--primary);
            background: var(--primary-bg-light);
        }
        .proto-toggle .proto-name {
            font-weight: 600;
        }

        .search-wrap {
            flex: 1 1 180px;
            min-width: 140px;
            position: relative;
        }
        .search-wrap input {
            width: 100%;
            padding: 0 16px 0 36px;
            border-radius: var(--btn-radius);
            border: 1px solid var(--border);
            background: white;
            font-size: 0.9rem;
            outline: none;
            transition: 0.2s;
            color: var(--text);
            height: var(--btn-height);
        }
        .search-wrap input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.15);
        }
        .search-wrap .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 0.9rem;
            pointer-events: none;
            opacity: 0.6;
        }

        /* ===== блок действий ===== */
        .actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            flex: 1 1 auto;
        }
        .actions button {
            background: none;
            border: 1px solid var(--border);
            padding: var(--btn-padding);
            border-radius: var(--btn-radius);
            font-size: var(--btn-font-size);
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: 0.2s;
            background: white;
            height: var(--btn-height);
            min-width: var(--btn-min-width);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .actions button:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-bg-hover);
        }
        .actions button.primary-btn {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        .actions button.primary-btn:hover {
            background: var(--primary-dark);
            border-color: var(--primary-dark);
        }

        .page-size-selector {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            height: var(--btn-height);
            flex-shrink: 0;
        }
        .page-size-selector select {
            padding: 0 8px;
            border-radius: var(--btn-radius);
            border: 1px solid var(--border);
            background: white;
            font-size: 0.8rem;
            outline: none;
            cursor: pointer;
            height: var(--btn-height);
            min-width: 60px;
        }
        .page-size-selector select:focus {
            border-color: var(--primary);
        }

        .protocol-info {
            margin: 0 0 20px 0;
            padding: 16px 18px;
            background: var(--bg);
            border-radius: var(--radius-sm);
            border-left: 4px solid var(--primary);
        }
        .protocol-info .info-title {
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--text);
            margin-bottom: 6px;
        }
        .protocol-info .info-desc {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .list-container {
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            overflow: hidden;
            background: white;
        }

        .list-header {
            display: grid;
            grid-template-columns: 1fr 120px 80px;
            padding: 12px 18px;
            background: var(--bg);
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border);
            gap: 6px;
        }
        .list-header .col-proto {
            text-align: center;
        }
        .list-header .col-copy {
            text-align: right;
        }
        .list-header span:first-child {
            text-align: left;
        }

        .proxy-list {
            max-height: 600px;
            overflow-y: auto;
            scroll-behavior: smooth;
            will-change: scroll-position;
        }
        .proxy-list::-webkit-scrollbar {
            width: 6px;
        }
        .proxy-list::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }
        .proxy-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .proxy-item {
            display: grid;
            grid-template-columns: 1fr 120px 80px;
            padding: 8px 18px;
            border-bottom: 1px solid var(--border);
            align-items: center;
            gap: 6px;
            transition: 0.15s;
            font-size: 0.9rem;
            will-change: transform;
            min-height: 48px;
        }
        .proxy-item:last-child {
            border-bottom: none;
        }
        .proxy-item:hover {
            background: var(--primary-bg-hover);
        }

        .proxy-item .address {
            font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace;
            font-weight: 500;
            letter-spacing: -0.2px;
            word-break: break-all;
            text-align: left;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .protocol-badge {
            justify-self: center;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 2px 12px;
            border-radius: 40px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            white-space: nowrap;
            text-align: center;
            display: inline-block;
        }
        .protocol-badge.http {
            background: var(--http-bg);
            color: var(--http-color);
        }
        .protocol-badge.https {
            background: var(--https-bg);
            color: var(--https-color);
        }
        .protocol-badge.socks4 {
            background: var(--socks4-bg);
            color: var(--socks4-color);
        }
        .protocol-badge.socks5 {
            background: var(--socks5-bg);
            color: var(--socks5-color);
        }

        /* ===== кнопка копирования в списке ===== */
        .copy-btn {
            justify-self: end;
            background: none;
            border: 1px solid var(--border);
            border-radius: var(--btn-radius);
            padding: var(--btn-padding);
            font-size: var(--btn-font-size);
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
            text-align: center;
            height: var(--btn-height);
            min-width: 80px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .copy-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-bg-hover);
        }
        .copy-btn.copied {
            border-color: var(--success);
            color: var(--success);
            background: #D1FAE5;
        }

        .empty-state {
            padding: 50px 20px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .loading-overlay {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 0;
            gap: 14px;
            color: var(--text-secondary);
            font-size: 1rem;
        }
        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== пагинация ===== */
        .pagination {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 8px 12px;
            padding: 14px 18px;
            background: var(--bg);
            border-top: 1px solid var(--border);
            font-size: 0.85rem;
        }
        .pagination button {
            background: white;
            border: 1px solid var(--border);
            padding: var(--btn-padding);
            border-radius: var(--btn-radius);
            font-size: var(--btn-font-size);
            cursor: pointer;
            transition: 0.2s;
            color: var(--text-secondary);
            font-weight: 500;
            height: var(--btn-height);
            min-width: var(--btn-min-width);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .pagination button:hover:not(:disabled) {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-bg-hover);
        }
        .pagination button:disabled {
            opacity: 0.4;
            cursor: default;
        }
        .pagination .page-info {
            font-weight: 500;
            color: var(--text);
            padding: 0 6px;
            flex-shrink: 0;
        }
        .pagination .page-numbers {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            align-items: center;
        }
        .pagination .page-numbers button {
            min-width: 36px;
            width: auto;
            padding: 0 8px;
            text-align: center;
            flex-shrink: 0;
        }
        .pagination .page-numbers button.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .footer {
            margin-top: 28px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }
        .footer a:hover {
            text-decoration: underline;
        }
        .footer .disclaimer {
            font-size: 0.8rem;
            opacity: 0.7;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #0F172A;
            color: white;
            padding: 10px 24px;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 500;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
            opacity: 0;
            transition: all 0.35s ease;
            pointer-events: none;
            z-index: 999;
            max-width: 90vw;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .toast.success {
            background: #065F46;
        }
        .toast.error {
            background: #991B1B;
        }

        /* ===== Мобильная оптимизация ===== */
        @media (max-width: 820px) {
            .app {
                padding: 18px 16px 28px;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }
            .header-left h1 {
                font-size: 1.6rem;
                text-align: center;
            }
            .header-left .subtitle {
                text-align: center;
                font-size: 1rem;
            }
            .header-right {
                justify-content: center;
                gap: 12px;
                flex-wrap: wrap;
            }
            .total-badge {
                font-size: 0.95rem;
                padding: 6px 18px;
            }
            .toggle-filters-btn {
                font-size: 0.9rem;
                min-width: 120px;
            }

            .filters {
                flex-direction: column;
                align-items: stretch;
                gap: 14px;
                padding: 16px 14px;
            }

            .filter-group {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 8px;
                width: 100%;
            }
            .filter-group .label {
                display: none;
            }
            .proto-toggle {
                min-width: 80px;
                flex: 0 1 auto;
                font-size: 0.8rem;
                height: 38px;
                padding: 0 12px;
            }
            .proto-toggle input[type="radio"] {
                width: 17px;
                height: 17px;
            }
            .proto-toggle .dot {
                width: 11px;
                height: 11px;
            }

            .search-wrap {
                min-width: 100%;
                max-width: 400px;
                flex: 1 1 auto;
            }
            .search-wrap input {
                font-size: 1rem;
                height: 40px;
                padding: 0 16px 0 40px;
            }
            .search-wrap .search-icon {
                font-size: 1rem;
                left: 16px;
            }

            .actions {
                justify-content: center;
                gap: 8px;
                width: 100%;
                flex-wrap: wrap;
            }
            .actions button {
                font-size: 0.85rem;
                min-width: 120px;
                height: 38px;
                padding: 0 14px;
                flex: 0 1 auto;
            }
            .page-size-selector {
                font-size: 0.85rem;
                height: 38px;
            }
            .page-size-selector select {
                font-size: 0.85rem;
                height: 38px;
                padding: 0 10px;
                min-width: 64px;
            }

            .protocol-info {
                padding: 14px 16px;
            }
            .protocol-info .info-title {
                font-size: 1rem;
            }
            .protocol-info .info-desc {
                font-size: 0.9rem;
            }

            .list-header {
                grid-template-columns: 1fr 100px 80px;
                padding: 12px 14px;
                font-size: 0.7rem;
                gap: 8px;
            }
            .list-header span:first-child {
                text-align: left;
            }
            .list-header .col-proto {
                text-align: center;
            }
            .list-header .col-copy {
                text-align: center;
            }

            .proxy-item {
                grid-template-columns: 1fr 100px 80px;
                padding: 10px 14px;
                font-size: 0.95rem;
                gap: 8px;
                min-height: 52px;
            }
            .proxy-item .address {
                text-align: left;
                font-size: 0.9rem;
            }
            .protocol-badge {
                justify-self: center;
                font-size: 0.7rem;
                padding: 2px 12px;
                text-align: center;
            }
            .copy-btn {
                justify-self: center;
                font-size: 0.8rem;
                min-width: 80px;
                height: 36px;
                padding: 0 12px;
                white-space: nowrap;
            }

            .pagination {
                font-size: 0.9rem;
                padding: 14px 16px;
                gap: 10px 16px;
            }
            .pagination button {
                font-size: 0.85rem;
                min-width: 100px;
                height: 38px;
                padding: 0 14px;
            }
            .pagination .page-numbers button {
                min-width: 36px;
                padding: 0 6px;
                font-size: 0.85rem;
                height: 36px;
            }

            .footer {
                font-size: 0.9rem;
                margin-top: 24px;
                padding-top: 18px;
            }
            .footer .disclaimer {
                font-size: 0.8rem;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            .app {
                padding: 14px 12px 24px;
                border-radius: 14px;
            }
            .header-left h1 {
                font-size: 1.4rem;
            }
            .header-left .subtitle {
                font-size: 0.85rem;
            }
            .total-badge {
                font-size: 0.8rem;
                padding: 4px 14px;
                height: 34px;
            }
            .toggle-filters-btn {
                font-size: 0.8rem;
                min-width: 100px;
                height: 34px;
                padding: 0 12px;
            }
            .lang-switch button {
                min-width: 38px;
                height: 28px;
                font-size: 0.7rem;
                padding: 0 8px;
            }

            .filters {
                padding: 12px 10px;
                gap: 12px;
            }

            .filter-group {
                gap: 6px;
            }
            .proto-toggle {
                min-width: 68px;
                font-size: 0.7rem;
                height: 32px;
                padding: 0 8px;
                gap: 4px;
            }
            .proto-toggle input[type="radio"] {
                width: 14px;

<body>

    <div class="app" id="app">

        <header class="header">
            <div class="header-left">
                <h1>full-free-proxy <small>v0.0.2</small></h1>
                <span class="subtitle" data-i18n="subtitle">Regular IP addresses should not be paid for.</span>

            <div class="header-right">
                <button class="toggle-filters-btn" id="toggleFiltersBtn" title="Показать/скрыть фильтры">
                    <span class="icon">⚙️</span> <span data-i18n="filters_toggle">Фильтры</span>
                </button>
                <div class="lang-switch">
                    <button class="active" data-lang="ru">RU</button>
                    <button data-lang="en">EN</button>

                <div class="total-badge">
                    <span data-i18n="total">Всего</span>: <span id="totalCount">0</span>
                </div>
            </div>
        </header>

        <!-- Обёртка для фильтров и информации о протоколе -->
        <div class="filters-wrapper" id="filtersWrapper">
            <div class="filters" id="filtersPanel">
                <div class="filter-group" id="protocolFilters">
                    <span class="label" data-i18n="protocols">Протокол</span>
                </div>

                <div class="search-wrap">
                    <span class="search-icon">&#128269;</span>
                    <input type="text" id="searchInput" placeholder="Поиск по IP или протоколу" autocomplete="off" data-i18n-placeholder="search_placeholder" />
                </div>

                <div class="actions">
                    <button id="copyAllBtn" class="primary-btn" data-i18n="copy_all">Копировать все</button>
                    <button id="copyPageBtn" data-i18n="copy_page">Копировать стр.</button>
                    <button id="downloadPageBtn" data-i18n="download_page">Скачать стр.</button>
                    <div class="page-size-selector">
                        <span data-i18n="per_page">На странице</span>
                        <select id="pageSizeSelect">
                            <option value="50">50</option>
                            <option value="100" selected>100</option>
                            <option value="200">200</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Блок информации о протоколе (без приложений) -->
            <div class="protocol-info" id="protocolInfo">
                <div class="info-title" id="infoTitle">HTTP</div>
                <div class="info-desc" id="infoDesc">...</div>
            </div>
        </div>

        <div class="list-container">
            <div class="list-header">
                <span data-i18n="address">Адрес</span>
                <span class="col-proto" data-i18n="protocol">Протокол</span>
                <span class="col-copy" data-i18n="copy">Копировать</span>
            </div>
            <div class="proxy-list" id="proxyList">
                <div class="loading-overlay">
                    <div class="spinner"></div>
                    <span data-i18n="loading">Загрузка прокси...</span>
                </div>

                <button id="prevPageBtn" disabled data-i18n="prev">Назад</button>
                <span class="page-info" id="pageInfo">1 / 1</span>
                <button id="nextPageBtn" disabled data-i18n="next">Вперед</button>
                <div class="page-numbers" id="pageNumbers"></div>

        <div class="footer">

            </div>
            <div class="disclaimer" data-i18n="disclaimer">За работоспособность не отвечаю — просто парсю готовые отфильтрованные списки с сайтов.</div>
        </div>

        <div class="toast" id="toast"></div>
    </div>

    <script>
        (function() {

            const PROTOCOL_FILES = [
                { file: 'http.txt', protocol: 'http' },
                { file: 'https.txt', protocol: 'https' },
                { file: 'socks4.txt', protocol: 'socks4' },
                { file: 'socks5.txt', protocol: 'socks5' },
            ];

            const PROTOCOL_LABELS = {
                http: 'HTTP',
                https: 'HTTPS',
                socks4: 'SOCKS4',
                socks5: 'SOCKS5',
            };

            const PROTOCOL_CLASSES = {
                http: 'http',
                https: 'https',
                socks4: 'socks4',
                socks5: 'socks5',
            };

            // Описания протоколов (без приложений)
            const PROTOCOL_INFO = {
                http: {
                    description: {
                        ru: 'HTTP (HyperText Transfer Protocol) — основной протокол передачи данных в интернете. Используется для загрузки веб-страниц, API-запросов и обмена данными между клиентом и сервером. Подходит для парсинга, сканирования, тестирования и автоматизации. Не шифрует трафик, что делает его быстрым, но менее безопасным.',
                        en: 'HTTP (HyperText Transfer Protocol) — the core protocol for data transfer on the web. Used for loading web pages, API requests, and data exchange between client and server. Suitable for crawling, scanning, testing, and automation. Does not encrypt traffic, making it fast but less secure.'
                    }
                },
                https: {
                    description: {
                        ru: 'HTTPS (HTTP Secure) — защищённая версия HTTP, использующая шифрование TLS/SSL. Обеспечивает конфиденциальность и целостность данных. Рекомендуется для работы с чувствительной информацией, банковскими транзакциями, авторизацией и любыми задачами, требующими безопасности.',
                        en: 'HTTPS (HTTP Secure) — the secure version of HTTP, using TLS/SSL encryption. Ensures confidentiality and data integrity. Recommended for handling sensitive information, banking transactions, authorization, and any tasks requiring security.'
                    }
                },
                socks4: {
                    description: {
                        ru: 'SOCKS4 — прокси-протокол, работающий на уровне сеанса. Поддерживает TCP-соединения, не поддерживает UDP и аутентификацию. Подходит для обхода сетевых ограничений, маршрутизации трафика через промежуточные узлы. Простой и быстрый, но менее безопасный, чем SOCKS5.',
                        en: 'SOCKS4 — a session-level proxy protocol. Supports TCP connections, does not support UDP or authentication. Suitable for bypassing network restrictions, routing traffic through intermediate nodes. Simple and fast, but less secure than SOCKS5.'
                    }
                },
                socks5: {
                    description: {
                        ru: 'SOCKS5 — улучшенная версия SOCKS4, поддерживающая UDP, аутентификацию (включая GSS-API) и IPv6. Более гибкий и безопасный протокол. Позволяет маршрутизировать любой тип трафика, включая DNS-запросы через прокси. Широко используется для анонимизации и обхода блокировок.',
                        en: 'SOCKS5 — an enhanced version of SOCKS4, supporting UDP, authentication (including GSS-API), and IPv6. More flexible and secure. Allows routing any type of traffic, including DNS queries through the proxy. Widely used for anonymization and bypassing restrictions.'
                    }
                }
            };

            // ----- i18n -----
            const LANG = {
                ru: {
                    subtitle: 'Обычные IP-адреса не должны быть платными.',
                    total: 'Всего',
                    protocols: 'Протокол',
                    search_placeholder: 'Поиск по IP или протоколу',
                    copy_all: 'Копировать все',
                    copy_page: 'Копировать стр.',
                    download_page: 'Скачать стр.',
                    per_page: 'На странице',
                    address: 'Адрес',
                    protocol: 'Протокол',
                    copy: 'Копировать',
                    loading: 'Загрузка прокси...',
                    prev: 'Назад',
                    next: 'Вперед',
                    copied: 'Скопировано',
                    copy_error: 'Ошибка копирования',
                    no_proxies: 'Нет данных. Убедитесь, что файлы прокси существуют.',
                    empty_filter: 'Нет прокси для выбранного протокола.',
                    footer_text: 'Сайт был сделан',
                    disclaimer: 'За работоспособность не отвечаю — просто парсю готовые отфильтрованные списки с сайтов.',
                    filters_toggle: 'Фильтры',
                },
                en: {
                    subtitle: 'Regular IP addresses should not be paid for.',
                    total: 'Total',
                    protocols: 'Protocol',
                    search_placeholder: 'Search by IP or protocol',
                    copy_all: 'Copy all',
                    copy_page: 'Copy page',
                    download_page: 'Download page',
                    per_page: 'Per page',
                    address: 'Address',
                    protocol: 'Protocol',
                    copy: 'Copy',
                    loading: 'Loading proxies...',
                    prev: 'Prev',
                    next: 'Next',
                    copied: 'Copied',
                    copy_error: 'Copy error',
                    no_proxies: 'No data. Make sure proxy files exist.',
                    empty_filter: 'No proxies for selected protocol.',
                    footer_text: 'Site made by',
                    disclaimer: 'I do not guarantee performance — I just parse ready filtered lists from sites.',
                    filters_toggle: 'Filters',
                }
            };

            let currentLang = 'ru';

            function t(key) {
                return LANG[currentLang] && LANG[currentLang][key] ? LANG[currentLang][key] : key;
            }

            function updateI18n() {
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.dataset.i18n;
                    el.textContent = t(key);
                });
                document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                    const key = el.dataset.i18nPlaceholder;
                    el.placeholder = t(key);
                });
            }

            // ----- state -----
            let allProxies = [];
            let filteredProxies = [];
            let activeProtocol = 'http';
            let currentPage = 1;
            let totalPages = 1;
            let loaded = false;
            let pageSize = 100;

            const $list = document.getElementById('proxyList');
            const $total = document.getElementById('totalCount');
            const $search = document.getElementById('searchInput');
            const $filtersContainer = document.getElementById('protocolFilters');
            const $copyAllBtn = document.getElementById('copyAllBtn');
            const $copyPageBtn = document.getElementById('copyPageBtn');
            const $downloadPageBtn = document.getElementById('downloadPageBtn');
            const $pageSizeSelect = document.getElementById('pageSizeSelect');
            const $toast = document.getElementById('toast');
            const $prevBtn = document.getElementById('prevPageBtn');
            const $nextBtn = document.getElementById('nextPageBtn');
            const $pageInfo = document.getElementById('pageInfo');
            const $pageNumbers = document.getElementById('pageNumbers');
            const $langButtons = document.querySelectorAll('.lang-switch button');
            const $toggleFiltersBtn = document.getElementById('toggleFiltersBtn');
            const $filtersWrapper = document.getElementById('filtersWrapper');
            const $protocolInfo = document.getElementById('protocolInfo');
            const $infoTitle = document.getElementById('infoTitle');
            const $infoDesc = document.getElementById('infoDesc');

            let toastTimer = null;

            function showToast(msg, type) {
                if (toastTimer) {
                    clearTimeout(toastTimer);
                    $toast.classList.remove('show', 'success', 'error');
                }
                $toast.textContent = msg;
                $toast.className = 'toast';
                if (type === 'success') $toast.classList.add('success');
                if (type === 'error') $toast.classList.add('error');
                void $toast.offsetWidth;
                $toast.classList.add('show');
                toastTimer = setTimeout(() => {
                    $toast.classList.remove('show');
                    toastTimer = null;
                }, 2200);
            }

            // ----- Toggle filters -----
            function toggleFilters(show) {
                if (show === undefined) {
                    const isHidden = $filtersWrapper.classList.contains('filters-wrapper-hidden');
                    show = isHidden;
                }
                if (show) {
                    $filtersWrapper.classList.remove('filters-wrapper-hidden');
                    localStorage.setItem('filtersVisible', 'true');
                } else {
                    $filtersWrapper.classList.add('filters-wrapper-hidden');
                    localStorage.setItem('filtersVisible', 'false');
                }
                const label = t('filters_toggle');
                $toggleFiltersBtn.innerHTML = `<span class="icon">⚙️</span> <span data-i18n="filters_toggle">${label}</span>`;
            }

            function initFiltersVisibility() {
                const saved = localStorage.getItem('filtersVisible');
                if (saved === 'false') {
                    toggleFilters(false);
                } else {
                    toggleFilters(true);
                }
            }

            // ----- Render protocol info -----
            function renderProtocolInfo(protocol) {
                const info = PROTOCOL_INFO[protocol];
                if (!info) {
                    $protocolInfo.style.display = 'none';
                    return;
                }
                $protocolInfo.style.display = 'block';
                const lang = currentLang;
                const title = PROTOCOL_LABELS[protocol] || protocol.toUpperCase();
                $infoTitle.textContent = title;
                $infoDesc.textContent = info.description[lang] || info.description.ru;
            }

            // ----- load proxies -----
            async function loadAllProxies() {
                allProxies = [];
                renderLoading();

                for (const { file, protocol } of PROTOCOL_FILES) {
                    try {
                        const resp = await fetch(file);
                        if (!resp.ok) continue;
                        const text = await resp.text();
                        const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');
                        for (const raw of lines) {
                            let full = raw.trim();
                            let address = full;
                            let detectedProtocol = protocol;

                            const idx = full.indexOf('://');
                            if (idx !== -1) {
                                const maybeProto = full.slice(0, idx).toLowerCase();
                                if (['http', 'https', 'socks4', 'socks5'].includes(maybeProto)) {
                                    detectedProtocol = maybeProto;
                                    address = full.slice(idx + 3);
                                } else {
                                    address = full;
                                }
                            } else {
                                full = protocol + '://' + full;
                                address = full.slice(protocol.length + 3);
                            }

                            if (!address || address.trim() === '') continue;
                            allProxies.push({
                                full: full,
                                address: address,
                                protocol: detectedProtocol,
                                sourceFile: file,
                            });
                        }
                    } catch (e) {
                        // ignore
                    }
                }

                loaded = true;

                if (allProxies.length === 0) {
                    renderEmpty(t('no_proxies'));
                    return;
                }

                activeProtocol = 'http';
                renderFilters();
                applyFiltersAndRender();
                renderProtocolInfo(activeProtocol);
            }

            function renderLoading() {
                $list.innerHTML = `
                    <div class="loading-overlay">
                        <div class="spinner"></div>
                        <span data-i18n="loading">${t('loading')}</span>
                    </div>
                `;
                updatePagination(0);
            }

            function renderEmpty(msg) {
                $list.innerHTML = `<div class="empty-state">${msg}</div>`;
                $total.textContent = '0';
                updatePagination(0);
            }

            function renderFilters() {
                if (allProxies.length === 0) return;
                const allProtos = [...new Set(allProxies.map(p => p.protocol))];
                const order = ['http', 'https', 'socks4', 'socks5'];
                allProtos.sort((a, b) => order.indexOf(a) - order.indexOf(b));

                let html = `<span class="label" data-i18n="protocols">${t('protocols')}</span>`;
                for (const proto of allProtos) {
                    const label = PROTOCOL_LABELS[proto] || proto.toUpperCase();
                    const checked = activeProtocol === proto ? 'checked' : '';
                    const activeClass = activeProtocol === proto ? 'active' : '';
                    const colorClass = PROTOCOL_CLASSES[proto] || '';
                    html += `
                        <label class="proto-toggle ${activeClass}" data-proto="${proto}">
                            <input type="radio" name="protocol" value="${proto}" ${checked} />
                            <span class="dot ${colorClass}"></span>
                            <span class="proto-name">${label}</span>
                        </label>
                    `;
                }
                $filtersContainer.innerHTML = html;

                document.querySelectorAll('.proto-toggle input[type="radio"]').forEach(radio => {
                    radio.addEventListener('change', function(e) {
                        if (this.checked) {
                            const proto = this.value;
                            activeProtocol = proto;
                            document.querySelectorAll('.proto-toggle').forEach(toggle => {
                                toggle.classList.toggle('active', toggle.dataset.proto === proto);
                            });
                            currentPage = 1;
                            applyFiltersAndRender();
                            renderProtocolInfo(proto);
                        }
                    });
                });
            }

            function applyFiltersAndRender() {
                if (allProxies.length === 0) {
                    renderLoading();
                    return;
                }

                const searchTerm = $search.value.trim().toLowerCase();

                filteredProxies = allProxies.filter(p => {
                    if (p.protocol !== activeProtocol) return false;
                    if (searchTerm !== '') {
                        return p.address.toLowerCase().includes(searchTerm) ||
                            p.protocol.toLowerCase().includes(searchTerm) ||
                            p.full.toLowerCase().includes(searchTerm);
                    }
                    return true;
                });

                const order = ['http', 'https', 'socks4', 'socks5'];
                filteredProxies.sort((a, b) => {
                    const idxA = order.indexOf(a.protocol);
                    const idxB = order.indexOf(b.protocol);
                    if (idxA !== idxB) return idxA - idxB;
                    return a.address.localeCompare(b.address);
                });

                $total.textContent = filteredProxies.length;
                totalPages = Math.ceil(filteredProxies.length / pageSize) || 1;
                if (currentPage > totalPages) currentPage = totalPages;
                if (currentPage < 1) currentPage = 1;

                renderPage(currentPage);
                updatePagination(filteredProxies.length);

                renderProtocolInfo(activeProtocol);
            }

            function renderPage(page) {
                const start = (page - 1) * pageSize;
                const end = Math.min(start + pageSize, filteredProxies.length);
                const pageItems = filteredProxies.slice(start, end);

                if (pageItems.length === 0) {
                    renderEmpty(t('empty_filter'));
                    return;
                }

                let html = '';
                for (const p of pageItems) {
                    const label = PROTOCOL_LABELS[p.protocol] || p.protocol.toUpperCase();
                    const cls = PROTOCOL_CLASSES[p.protocol] || '';
                    html += `
                        <div class="proxy-item" data-full="${p.full}" data-address="${p.address}">
                            <span class="address">${p.address}</span>
                            <span class="protocol-badge ${cls}">${label}</span>
                            <button class="copy-btn" title="${t('copy')}">${t('copy')}</button>
                        </div>
                    `;
                }
                $list.innerHTML = html;

                $list.querySelectorAll('.proxy-item').forEach(item => {
                    const full = item.dataset.full;
                    const copyBtn = item.querySelector('.copy-btn');
                    if (copyBtn) {
                        copyBtn.addEventListener('click', function(e) {
                            e.stopPropagation();
                            copyToClipboard(full, this);
                        });
                    }
                    item.addEventListener('dblclick', function(e) {
                        if (e.target.closest('button')) return;
                        copyToClipboard(full, this.querySelector('.copy-btn'));
                    });
                });
            }

            function updatePagination(total) {
                if (total === undefined) total = filteredProxies.length;
                const totalPages = Math.ceil(total / pageSize) || 1;
                $prevBtn.disabled = currentPage <= 1;
                $nextBtn.disabled = currentPage >= totalPages;
                $pageInfo.textContent = `${currentPage} / ${totalPages}`;

                let numsHtml = '';
                const maxVisible = 7;
                let startPage = Math.max(1, currentPage - Math.floor(maxVisible / 2));
                let endPage = Math.min(totalPages, startPage + maxVisible - 1);
                if (endPage - startPage < maxVisible - 1) {
                    startPage = Math.max(1, endPage - maxVisible + 1);
                }
                for (let i = startPage; i <= endPage; i++) {
                    const active = i === currentPage ? 'active' : '';
                    numsHtml += `<button class="${active}" data-page="${i}">${i}</button>`;
                }
                $pageNumbers.innerHTML = numsHtml;
                $pageNumbers.querySelectorAll('button').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const page = parseInt(this.dataset.page);
                        if (page !== currentPage) {
                            currentPage = page;
                            renderPage(currentPage);
                            updatePagination(filteredProxies.length);
                        }
                    });
                });
            }

            // ----- copy / download functions -----
            function copyToClipboard(text, btnElement) {
                if (!text) return;
                const doCopy = (str) => {
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(str).then(() => {
                            showToast(t('copied') + ': ' + str, 'success');
                            if (btnElement) {
                                const orig = btnElement.textContent;
                                btnElement.textContent = t('copied');
                                btnElement.classList.add('copied');
                                setTimeout(() => {
                                    btnElement.textContent = orig;
                                    btnElement.classList.remove('copied');
                                }, 1200);
                            }
                        }).catch(() => fallbackCopy(str));
                    } else {
                        fallbackCopy(str);
                    }
                };
                doCopy(text);
            }

            function fallbackCopy(text) {
                try {
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    ta.style.position = 'fixed';
                    ta.style.left = '-9999px';
                    ta.style.top = '-9999px';
                    document.body.appendChild(ta);
                    ta.focus();
                    ta.select();
                    const ok = document.execCommand('copy');
                    document.body.removeChild(ta);
                    if (ok) {
                        showToast(t('copied') + ': ' + text, 'success');
                    } else {
                        showToast(t('copy_error'), 'error');
                    }
                } catch (e) {
                    showToast(t('copy_error'), 'error');
                }
            }

            function copyAllFiltered() {
                if (filteredProxies.length === 0) {
                    showToast(t('empty_filter'), 'error');
                    return;
                }
                const lines = filteredProxies.map(p => p.full);
                const text = lines.join('\n');
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(() => {
                        showToast(t('copied') + ' ' + lines.length + ' ' + t('protocols').toLowerCase(), 'success');
                    }).catch(() => fallbackCopy(text));
                } else {
                    fallbackCopy(text);
                }
            }

            function copyCurrentPage() {
                const start = (currentPage - 1) * pageSize;
                const end = Math.min(start + pageSize, filteredProxies.length);
                const pageItems = filteredProxies.slice(start, end);
                if (pageItems.length === 0) {
                    showToast(t('empty_filter'), 'error');
                    return;
                }
                const lines = pageItems.map(p => p.full);
                const text = lines.join('\n');
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(text).then(() => {
                        showToast(t('copied') + ' ' + lines.length + ' ' + t('protocols').toLowerCase() + ' (' + t(
                            'page') + ')', 'success');
                    }).catch(() => fallbackCopy(text));
                } else {
                    fallbackCopy(text);
                }
            }

            function downloadCurrentPage() {
                const start = (currentPage - 1) * pageSize;
                const end = Math.min(start + pageSize, filteredProxies.length);
                const pageItems = filteredProxies.slice(start, end);
                if (pageItems.length === 0) {
                    showToast(t('empty_filter'), 'error');
                    return;
                }
                const lines = pageItems.map(p => p.full);
                const text = lines.join('\n');
                const blob = new Blob([text], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `proxies_page_${currentPage}.txt`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('Скачано ' + lines.length + ' прокси (страница ' + currentPage + ')', 'success');
            }

            // ----- language -----
            function setLang(lang) {
                currentLang = lang;
                document.querySelectorAll('.lang-switch button').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.lang === lang);
                });
                updateI18n();
                const label = t('filters_toggle');
                $toggleFiltersBtn.innerHTML = `<span class="icon">⚙️</span> <span data-i18n="filters_toggle">${label}</span>`;
                if (allProxies.length > 0) {
                    applyFiltersAndRender();
                    renderProtocolInfo(activeProtocol);
                } else {
                    renderLoading();
                }
            }

            $langButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    const lang = this.dataset.lang;
                    if (lang !== currentLang) {
                        setLang(lang);
                    }
                });
            });

            // ----- Toggle filters event -----
            $toggleFiltersBtn.addEventListener('click', function() {
                const isHidden = $filtersWrapper.classList.contains('filters-wrapper-hidden');
                toggleFilters(isHidden);
            });

            // ----- events -----
            $search.addEventListener('input', function() {
                currentPage = 1;
                applyFiltersAndRender();
            });

            $copyAllBtn.addEventListener('click', copyAllFiltered);
            $copyPageBtn.addEventListener('click', copyCurrentPage);
            $downloadPageBtn.addEventListener('click', downloadCurrentPage);

            $pageSizeSelect.addEventListener('change', function() {
                pageSize = parseInt(this.value);
                currentPage = 1;
                applyFiltersAndRender();
            });

            $prevBtn.addEventListener('click', function() {
                if (currentPage > 1) {
                    currentPage--;
                    renderPage(currentPage);
                    updatePagination(filteredProxies.length);
                }
            });

            $nextBtn.addEventListener('click', function() {
                const totalPages = Math.ceil(filteredProxies.length / pageSize);
                if (currentPage < totalPages) {
                    currentPage++;
                    renderPage(currentPage);
                    updatePagination(filteredProxies.length);
                }
            });

            document.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
                    e.preventDefault();
                    $search.focus();
                    $search.select();
                }
                if (e.key === 'Escape') {
                    $search.blur();
                }
            });

            // init i18n
            updateI18n();

            initFiltersVisibility();

            loadAllProxies();

        })();
    </script>

</body>
</html>
